@if (visible()) {
  <button
    class="cw-fab"
    type="button"
    [class.is-open]="open()"
    (click)="toggle()"
    [attr.aria-expanded]="open()"
    aria-label="Чат с Александром"
  >
    @if (open()) {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
      </svg>
      @if (unread() > 0) {
        <span class="cw-badge">{{ unread() > 9 ? '9+' : unread() }}</span>
      }
    }
  </button>

  @if (open()) {
    <div class="cw-panel" role="dialog" aria-label="Чат с Александром">
      <header class="cw-head">
        <span class="cw-avatar" aria-hidden="true">А</span>
        <div class="cw-head-text">
          <div class="cw-name">Александр</div>
          <div class="cw-status">Обычно отвечаю в течение часа</div>
        </div>
        <button class="cw-close" type="button" (click)="toggle()" aria-label="Закрыть">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </header>

      <div class="cw-body" #scroll>
        @if (messages().length === 0) {
          <div class="cw-empty">
            <span class="cw-avatar cw-avatar-lg" aria-hidden="true">А</span>
            <p>Здравствуйте! Напишите вопрос — отвечу, как только освобожусь.</p>
          </div>
        }
        @for (m of messages(); track m.id) {
          <div class="cw-msg" [class.out]="m.direction === 'incoming'" [class.in]="m.direction === 'outgoing'">
            <div class="cw-bubble">{{ m.text }}</div>
          </div>
        }
      </div>

      <form class="cw-foot" (submit)="send(); $event.preventDefault()">
        <input
          class="cw-input"
          type="text"
          placeholder="Ваше сообщение…"
          maxlength="2000"
          autocomplete="off"
          [ngModel]="draft()"
          (ngModelChange)="draft.set($event)"
        />
        <button class="cw-send" type="submit" [disabled]="!draft().trim() || sending()" aria-label="Отправить">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="22" y1="2" x2="11" y2="13" />
            <polygon points="22 2 15 22 11 13 2 9 22 2" />
          </svg>
        </button>
      </form>
    </div>
  }
}
