# ===== HTTP-контекст (файл включён в http {}) =====

# Кэш SSR + API-ответов
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=site_cache:10m max_size=200m inactive=60m use_temp_path=off;

# Лимиты запросов (защита от ботов/DDoS)
limit_req_zone $binary_remote_addr zone=page_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Сжатие
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/xml image/svg+xml;

# ===== www -> apex (HTTP) =====
server {
    listen 80;
    server_name www.code-orbit.ru;
    return 301 https://code-orbit.ru$request_uri;
}

# www -> apex (HTTPS)
server {
    listen 443 ssl;
    server_name www.code-orbit.ru;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    return 301 https://code-orbit.ru$request_uri;
}

# apex: http -> https
server {
    listen 80;
    server_name code-orbit.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name code-orbit.ru;
    client_max_body_size 20m;

    # IP-чёрный список (генерируется бэкендом, синхронизируется по cron)
    include /etc/nginx/blacklist/blocked.conf;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    limit_conn conn_limit 20;

    # SEO-файлы отдаёт бэкенд
    location = /sitemap.xml {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API: GET кэшируется (10 мин), POST/формы — напрямую
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_cache site_cache;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_methods GET HEAD;
        proxy_cache_lock on;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /srfaslkfhjsdhf/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Медиа — nginx отдаёт напрямую, кэш на сутки (обложки/фото могут меняться)
    location ^~ /media/ {
        alias /media/;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # Angular-ассеты (хэшированные, неизменяемые) — долгий кэш
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|webp|ico|txt)$ {
        proxy_cache site_cache;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        expires 30d;
        proxy_pass http://frontend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Всё остальное -> Angular SSR (HTML кэшируется 10 мин, без учёта UTM)
    location / {
        limit_req zone=page_limit burst=40 nodelay;
        proxy_cache site_cache;
        proxy_cache_key "$scheme$host$uri";
        proxy_cache_valid 200 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_methods GET HEAD;
        proxy_cache_lock on;
        proxy_pass http://frontend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
